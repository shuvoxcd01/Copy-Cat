[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copy-cat"
version = "0.1.0"
description = "Imitation learning by capturing screen observations and user actions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "mss>=10",
    "pynput",
]

[project.optional-dependencies]
replay = ["opencv-python"]

[tool.setuptools.packages.find]
where = ["src"]
