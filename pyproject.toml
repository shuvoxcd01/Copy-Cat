[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copy-cat"
version = "0.1.0"
description = "Imitation learning by capturing screen observations and user actions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "mss>=10",
    "pynput",
]

[project.optional-dependencies]
replay = ["opencv-python"]
test = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.coverage.run]
source = ["copy_cat"]
branch = true

[tool.coverage.report]
show_missing = true
# The __main__ blocks are manual demos that drive the real screen and keyboard.
exclude_also = ['if __name__ == "__main__":']
